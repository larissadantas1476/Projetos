<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cotação de Seguro de Veículo</h1>
    <br>
    <form action="cotacao" method="post">
       <fieldset>
        <legend>Condutor</legend>
        <label for="nome">Nome do Proprietário:</label>
        <input type="text" id="nome" name="nome" required>
        <br>
        <p></p>
        <label for="cnh">CNH:</label>
        <input type="text" id="cnh" name="cnh" required>
        <br>
        <p></p>
        <label for="data">Data de Emissão da CNH:</label>
        <input type="date" id="data" name="data" required>
        <br>
        <p></p>
        <p>Estado Civil:</p>
        <input type="radio" id="solteiro" name="estado_civil" value="solteiro">
        <label for="solteiro">Solteiro</label>
        <input type="radio" id="casado" name="estado_civil" value="casado">
        <label for="casado">Casado</label>
        <input type="radio" id="divorciado" name="estado_civil" value="divorciado">
        <label for="divorciado">Divorciado</label>
        <input type="radio" id="viuvo" name="estado_civil" value="viuvo">
        <label for="viuvo">Viúvo</label>
       </fieldset>
       <br>
       <fieldset>
        <legend>Veículo</legend>
        <label for="placa"> Placa do Carro:</label>
        <input type="text" id="placa" name="placa" placeholder="ABC-1234" required>
        <br>
        <p></p>
        <label for="marca">Marca do Veículo:</label>
        <select id="marca" name="marca" required>
            <option value="fiat">Fiat</option>
            <option value="vw">VW</option>
            <option value="chevrolet">Chevrolet</option>
            <option value="toyota">Toyota</option>
            <option value="honda">Honda</option>
            <option value="outro">Outro</option>
        </select>
        <br>
        <p></p>
        <label for="ano"> Ano do Modelo:</label>
        <input type="text" id="ano" name="ano" required>
       </fieldset>
         <br>
         <fieldset>
            <legend>Uso</legend>
            <p>Usa o carro para trabalho (Uber/Táxi)?</p>
            <input type="radio" id="sim" name="trabalho" value="sim">
            <label for="sim">Sim</label>
            <input type="radio" id="nao" name="trabalho" value="nao">
            <label for="nao">Não</label>
            <br>
            <p></p>
            <input type="checkbox" id="rastreador" name="rastreador" value="rastreador">
            <label for="rastreador">Possui rastreador instalado</label>
         </fieldset>
         <br>
         <button type="submit">Solicitar Cotação</button>
</body>
</html>
